  text-decoration: none;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h1,
h2,
h3,
h4,
h5,
h6,
p {

b,

  gap: 12px;
  width: 100%;
  padding: 0;

  overflow-wrap: break-word;

  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  left: 0;
  width: max-content;

    calc(100vw - 10px)

  );

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;

.viz-badge {

.sr-only {

.btn {

  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  margin: 0;
  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;

a.btn {

  text-decoration: none;

.btn:not(:disabled):hover {

  color: var(--muted-foreground);
  background: transparent;

.btn:disabled {

  opacity: 0.4;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,

  min-height: 28px;

  padding: 0 32px 0 8px;

.form-select:focus-visible {

  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

  height: 100%;

  height: 14px;

  outline: 2px solid var(--ring);
  outline-offset: 2px;

  cursor: not-allowed;
  pointer-events: none;

  cursor: not-allowed;

.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);

  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  display: block;

  height: 28px;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;theme-toggle-patterns&quot;);
      const mock = root.querySelector(&quot;.mock-site&quot;);
      const patternButtons = Array.from(root.querySelectorAll(&quot;[data-pattern-choice]&quot;));
      const patternSlots = Array.from(root.querySelectorAll(&quot;[data-pattern-slot]&quot;));
      const cycleButtons = Array.from(root.querySelectorAll(&quot;.theme-cycle&quot;));
      const modeButtons = Array.from(root.querySelectorAll(&quot;[data-mode-choice]&quot;));
      const themeSelects = Array.from(root.querySelectorAll(&quot;[data-theme-select]&quot;));
      const kind = root.querySelector(&quot;#pattern-kind&quot;);
      const name = root.querySelector(&quot;#pattern-name&quot;);
      const description = root.querySelector(&quot;#pattern-description&quot;);
      const modeStatus = root.querySelector(&quot;#mode-status&quot;);
      const systemPreference = window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

      const patterns = {
        utility: {
          kind: &quot;추천&quot;,
          name: &quot;상단 유틸리티 행 · 아이콘&quot;,
          description: &quot;현재 Back to blog 링크의 반대편에 놓아 전역 헤더 없이 최소한으로 추가&quot;
        },
        menu: {
          kind: &quot;MDN형&quot;,
          name: &quot;상단 우측 · 선택 메뉴&quot;,
          description: &quot;System·Light·Dark를 명확히 제공하고 헤더 공간은 적게 사용&quot;
        },
        segmented: {
          kind: &quot;명시적&quot;,
          name: &quot;상단 우측 · 3단 선택&quot;,
          description: &quot;현재 선택이 늘 보이지만 작은 화면에서는 가장 많은 폭을 차지&quot;
        },
        reader: {
          kind: &quot;확장형&quot;,
          name: &quot;글 메타데이터 · 본문 도구&quot;,
          description: &quot;향후 글자 크기·본문 폭까지 제공할 독서 설정으로 확장하기 좋음&quot;
        },
        floating: {
          kind: &quot;항상 접근&quot;,
          name: &quot;본문 우하단 · 플로팅 버튼&quot;,
          description: &quot;스크롤 중에도 찾기 쉽지만 글을 가리거나 시선을 끌 가능성이 있음&quot;
        },
        footer: {
          kind: &quot;최소 노출&quot;,
          name: &quot;푸터 · 선택 메뉴&quot;,
          description: &quot;본문과 헤더가 가장 깨끗하지만 처음 방문한 독자가 발견하기 어려움&quot;
        }
      };

      let selectedPattern = &quot;utility&quot;;
      let themeChoice = &quot;light&quot;;

      const effectiveTheme = () =&gt; {
        if (themeChoice === &quot;system&quot;) return systemPreference.matches ? &quot;dark&quot; : &quot;light&quot;;
        return themeChoice;
      };

      const syncTheme = () =&gt; {
        const effective = effectiveTheme();
        mock.dataset.effectiveTheme = effective;
        cycleButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(effective === &quot;dark&quot;));
        });
        modeButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.modeChoice === themeChoice));
        });
        themeSelects.forEach((select) =&gt; {
          select.value = themeChoice;
        });
        const choiceLabel = themeChoice === &quot;system&quot; ? &quot;System&quot; : themeChoice === &quot;dark&quot; ? &quot;Dark&quot; : &quot;Light&quot;;
        const detail = themeChoice === &quot;system&quot; ? &quot;자동 · 현재 &quot; + (effective === &quot;dark&quot; ? &quot;Dark&quot; : &quot;Light&quot;) : &quot;직접 선택&quot;;
        modeStatus.textContent = choiceLabel + &quot; · &quot; + detail;
      };

      const selectPattern = (patternId) =&gt; {
        const pattern = patterns[patternId];
        if (!pattern) return;
        selectedPattern = patternId;
        mock.dataset.pattern = selectedPattern;
        patternButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.patternChoice === selectedPattern));
        });
        patternSlots.forEach((slot) =&gt; {
          slot.hidden = slot.dataset.patternSlot !== selectedPattern;
        });
        kind.textContent = pattern.kind;
        name.textContent = pattern.name;
        description.textContent = pattern.description;
      };

      patternButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; selectPattern(button.dataset.patternChoice));
      });

      cycleButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          themeChoice = effectiveTheme() === &quot;dark&quot; ? &quot;light&quot; : &quot;dark&quot;;
          syncTheme();
        });
      });

      modeButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          themeChoice = button.dataset.modeChoice;
          syncTheme();
        });
      });

      themeSelects.forEach((select) =&gt; {
        select.addEventListener(&quot;change&quot;, () =&gt; {
          themeChoice = select.value;
          syncTheme();
        });
      });

      systemPreference.addEventListener(&quot;change&quot;, () =&gt; {
        if (themeChoice === &quot;system&quot;) syncTheme();
      });

      selectPattern(selectedPattern);
      syncTheme();
    })();
